[project]
name = "logger"
version = "0.1.0"
description = "van/# MQTT -> InfluxDB point writer for the renewvan hub"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
    "influxdb-client>=1.40,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logger*"]
